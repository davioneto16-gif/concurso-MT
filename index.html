<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estudos - Câmara de Cuiabá (Nível Médio)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        accent: '#3b82f6',
                        accentHover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-darkBg text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top Bar / Navigation -->
    <header class="bg-darkCard border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">Câmara de Cuiabá - Nível Médio</h1>
                    <p class="text-xs text-slate-400">Edital nº 001/2026-CMC | Cargo: Técnico Legislativo</p>
                </div>
            </div>
            
            <!-- Global Actions & Backup -->
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded font-medium transition flex items-center space-x-1" title="Baixar Backup dos Dados">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Exportar Dados</span>
                </button>
                <label class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded font-medium transition flex items-center space-x-1 cursor-pointer" title="Restaurar Backup">
                    <i class="fa-solid fa-upload"></i> <span class="hidden sm:inline">Importar</span>
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="resetData()" class="bg-red-900/40 hover:bg-red-900 text-red-300 text-xs px-3 py-2 rounded font-medium transition" title="Zerar Progresso">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Countdown & Overview Widget -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Countdown -->
            <div class="bg-darkCard border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-regular fa-clock text-blue-500"></i> Contagem Regressiva para a Prova
                    </h2>
                    <span class="text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded font-medium">13 Dez 2026</span>
                </div>
                <div id="countdown" class="grid grid-cols-4 gap-2 text-center my-2">
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        <span id="days" class="text-2xl font-bold text-blue-400">00</span>
                        <p class="text-[10px] text-slate-400 uppercase">Dias</p>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        <span id="hours" class="text-2xl font-bold text-blue-400">00</span>
                        <p class="text-[10px] text-slate-400 uppercase">Horas</p>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        <span id="minutes" class="text-2xl font-bold text-blue-400">00</span>
                        <p class="text-[10px] text-slate-400 uppercase">Min</p>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        <span id="seconds" class="text-2xl font-bold text-blue-400">00</span>
                        <p class="text-[10px] text-slate-400 uppercase">Seg</p>
                    </div>
                </div>
                <p class="text-xs text-slate-400 text-center mt-2">Provas no período da Tarde (Cuiabá-MT)</p>
            </div>

            <!-- Salary & Info Card -->
            <div class="bg-darkCard border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
